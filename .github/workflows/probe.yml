name: Probe fuentes
on:
  schedule:
    # Martes y jueves a las 17:00 UTC = 13:00 en Nueva York, con la sesion abierta.
    # Se programa asi a proposito: lanzado en fin de semana o en festivo, este probe
    # responde 200 y devuelve tablas vacias, y entonces no distingue "la fuente esta
    # rota" de "hoy no hubo sesion". Paso dos veces (domingo 6-sep y Labor Day 7-sep
    # de 2026) y las dos veces hubo que pedirselo a Maria a mano para nada.
    # Dos dias en vez de uno para que un festivo no se lleve la semana entera por
    # delante. Si cae en festivo, la pasada siguiente lo corrige sola.
    - cron: '0 17 * * 2,4'
  workflow_dispatch:        # y a mano cuando haga falta
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/probe.py
      - run: python scripts/probe_news.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe.json probe_news.json && git commit -m "probe" && git push
